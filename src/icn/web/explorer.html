<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__ - Knowledge Explorer</title>
<link rel="stylesheet" href="explorer.css">
</head>
<body>
<div id="app">
  <div class="card rail">
    <div class="brand">
      <h1>__TITLE__</h1>
      <p id="stats"></p>
      <label class="repo-picker" id="repo-picker" hidden>
        <span>Repository</span><select id="repo"></select>
      </label>
    </div>
    <div class="scroll">
      <div class="search">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
        <input type="search" id="q" placeholder="Search"><kbd>/</kbd>
      </div>
      <h2>View</h2>
      <div class="scopes" id="scopes">
        <button data-scope="areas" class="on">Areas</button>
        <button data-scope="focus">Focus</button>
        <button data-scope="all">Everything</button>
      </div>
      <p class="scope-note" id="scope-note"></p>
      <div id="area-list"></div>
      <h2>Show</h2><div id="kinds"></div>
      <h2>Severity</h2><div id="sevs"></div>
      <h2>Anchor</h2><div id="anchors"></div>
      <h2>Relationships</h2><div id="edges"></div>
    </div>
  </div>

  <div class="stage">
    <canvas id="c"></canvas>
    <div class="float toolbar">
      <button class="btn" id="fit" title="Fit to view">Fit</button>
      <button class="btn" id="relayout" title="Re-run layout">Re-layout</button>
      <button class="btn" id="lbl" title="Toggle labels">Labels</button>
      <div class="menu-wrap">
        <button class="btn" id="exportBtn" title="Export this knowledge"
                aria-haspopup="true" aria-expanded="false">Export</button>
        <div class="menu" id="exportMenu" role="menu" hidden>
          <button role="menuitem" data-fmt="md">
            <b>Markdown</b><span>Readable anywhere. Re-importable.</span></button>
          <button role="menuitem" data-fmt="json">
            <b>Graph JSON</b><span>Nodes and edges, raw.</span></button>
          <button role="menuitem" data-fmt="html">
            <b>This page</b><span>Self-contained explorer.</span></button>
          <div class="menu-sep"></div>
          <button role="menuitem" data-fmt="png">
            <b>Image</b><span>PNG of the current view.</span></button>
          <button role="menuitem" data-fmt="clip">
            <b>Copy visible</b><span>What is on screen, as markdown.</span></button>
        </div>
      </div>
    </div>
    <div class="float legend" id="legend"></div>
    <div class="float count" id="count"></div>
  </div>

  <div class="card" id="side">
    <div class="shead">
      <div id="shead-tags"></div>
      <button class="close" id="close" title="Close">&times;</button>
    </div>
    <div class="sbody" id="sbody"></div>
  </div>
</div>
<div class="tip" id="tip"></div>

<script id="data" type="application/json">__DATA__</script>
<script src="explorer.js"></script>
</body>
</html>
