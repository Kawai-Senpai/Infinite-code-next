<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img"
     aria-label="Infinite Code Next: code remembers what it does, this remembers why">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c2340"/>
      <stop offset="1" stop-color="#141930"/>
    </linearGradient>
    <linearGradient id="k" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#7c4dff"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity=".26"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="300" rx="24" fill="url(#bg)"/>
  <circle cx="960" cy="150" r="190" fill="url(#glow)"/>

  <!-- Left: the mark, at banner scale. -->
  <g transform="translate(84 106) scale(1.35)">
    <path d="M46 14a22 22 0 1 0 8 14" fill="none" stroke="url(#k)"
          stroke-width="3.2" stroke-linecap="round" opacity=".5"/>
    <g stroke="url(#k)" stroke-width="2.6" stroke-linecap="round">
      <path d="M32 32 L18 21"/><path d="M32 32 L47 27"/><path d="M32 32 L27 48"/>
    </g>
    <g fill="#34d399">
      <circle cx="18" cy="21" r="4.6"/><circle cx="47" cy="27" r="4.6"/>
      <circle cx="27" cy="48" r="4.6"/>
    </g>
    <circle cx="32" cy="32" r="9" fill="url(#k)"/>
    <circle cx="32" cy="32" r="9" fill="none" stroke="#c4b5fd" stroke-width="1.4" opacity=".65"/>
  </g>

  <text x="212" y="132" fill="#eef1fa" font-size="46" font-weight="650"
        font-family="ui-sans-serif,-apple-system,Segoe UI,Inter,system-ui,sans-serif"
        letter-spacing="-1">Infinite Code Next</text>
  <text x="214" y="172" fill="#9aa3c4" font-size="19"
        font-family="ui-sans-serif,-apple-system,Segoe UI,Inter,system-ui,sans-serif">
    Code remembers what it does. This remembers why.</text>

  <!-- Right: the graph the product actually builds - a memory anchored across
       two files, guarded by a test. Small, but a real shape, not decoration. -->
  <g transform="translate(830 60)">
    <g stroke="#8b5cf6" stroke-width="2" stroke-linecap="round" opacity=".85">
      <path d="M120 90 L46 44"/><path d="M120 90 L214 52"/><path d="M120 90 L70 148"/>
    </g>
    <path d="M120 90 L206 146" stroke="#34d399" stroke-width="2"
          stroke-dasharray="5 4" stroke-linecap="round" opacity=".85"/>
    <g stroke="#39436e" stroke-width="1.4">
      <path d="M46 44 L214 52"/><path d="M70 148 L206 146"/>
    </g>
    <g fill="#4d7cfe">
      <circle cx="46" cy="44" r="7"/><circle cx="214" cy="52" r="7"/>
    </g>
    <circle cx="70" cy="148" r="6" fill="#34d399"/>
    <circle cx="206" cy="146" r="6" fill="#34d399"/>
    <circle cx="120" cy="90" r="15" fill="#8b5cf6" opacity=".22"/>
    <circle cx="120" cy="90" r="10" fill="#8b5cf6"/>
  </g>

  <g font-family="ui-sans-serif,-apple-system,Segoe UI,Inter,system-ui,sans-serif"
     font-size="13" fill="#6b7499">
    <circle cx="216" cy="216" r="4.5" fill="#8b5cf6"/>
    <text x="228" y="221">memory</text>
    <circle cx="316" cy="216" r="4.5" fill="#4d7cfe"/>
    <text x="328" y="221">file</text>
    <circle cx="386" cy="216" r="4.5" fill="#34d399"/>
    <text x="398" y="221">symbol</text>
    <text x="212" y="252" fill="#6b7499">MCP · zero config · no LLM calls · 172 tests</text>
  </g>
</svg>
