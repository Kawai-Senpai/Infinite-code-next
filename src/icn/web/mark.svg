<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img"
     aria-label="Infinite Code Next: a memory node anchored to three code nodes">
  <!-- The mark is the product's one idea: a piece of knowledge (violet, centre)
       anchored to code (green) that would otherwise carry no memory of it. The
       ring is left open - knowledge is never finished being verified.

       Weights are set so the shape survives to a 16px favicon: the memory node
       stays dominant, the three anchors read as a triangle even when the ring
       and edges blur away. -->
  <defs>
    <linearGradient id="icn-k" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#7c4dff"/>
    </linearGradient>
  </defs>

  <path d="M44 12.5a23 23 0 1 0 9.5 15"
        fill="none" stroke="url(#icn-k)" stroke-width="3"
        stroke-linecap="round" opacity=".45"/>

  <g stroke="url(#icn-k)" stroke-width="3" stroke-linecap="round">
    <path d="M32 32 L18.5 22"/>
    <path d="M32 32 L46 27.5"/>
    <path d="M32 32 L27 47"/>
  </g>

  <g fill="#34d399">
    <circle cx="18.5" cy="22" r="5.4"/>
    <circle cx="46" cy="27.5" r="5.4"/>
    <circle cx="27" cy="47" r="5.4"/>
  </g>

  <circle cx="32" cy="32" r="10.5" fill="url(#icn-k)"/>
  <circle cx="32" cy="32" r="10.5" fill="none" stroke="#c4b5fd"
          stroke-width="1.5" opacity=".6"/>
</svg>
