[project]
name = "infinite-code-next"
version = "0.1.0"
description = "Zero-config MCP server: a versioned semantic provenance layer for source code."
authors = [{ name = "Ranit Bhowmick", email = "bhowmickranitking@duck.com" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "tree-sitter>=0.24",
    "tree-sitter-language-pack>=0.9",
]

[project.scripts]
infinite-code-next = "icn.__main__:main"
icn = "icn.__main__:main"
icn-explore = "icn.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]
# Semantic search. Optional on purpose: without these ICN falls back to
# lexical retrieval and works exactly as it did before. model2vec is a static
# embedding model, so there is no torch and no GPU in this dependency tree.
semantic = ["model2vec>=0.9", "numpy>=1.24"]

[project.urls]
Homepage = "https://ranitbhowmick.com"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
icn = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
